                  raise ApiError(400, "Bukan folder")
              items = []
              for e in sorted(p.iterdir(), key=lambda x: (not x.is_dir(), x.name.lower())):
                  try:
                      s = e.stat()
                      items.append({"name": e.name, "dir": e.is_dir(), "size": s.st_size, "mtime": int(s.st_mtime)})
                  except OSError:
