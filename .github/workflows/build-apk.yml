          # ───────────────────────── watchdog ─────────────────────────
          def watchdog():
              restarts, last_check = [], 0
              while True:
                  time.sleep(5)
                  try:
                      c, st = load_cfg(), server_state()
                      if st["state"] == "stopped":
                          if st.get("crashed") and TAILER.flags()["stopping"]:
                              set_desired(False)
                          if get_desired() and c["auto_restart"]:
                              restarts = [t for t in restarts if time.time() - t < 600]
                              if len(restarts) < 3:
                                  restarts.append(time.time())
                                  TAILER.note("[panel] Server berhenti tiba-tiba, dijalankan ulang otomatis")
                                  start_server()
                              else:
                                  set_desired(False)
                                  TAILER.note("[panel] Server crash 3x dalam 10 menit, auto-restart dihentikan")
                      hrs = to_int(c["backup_every_h"], 0)
                      if hrs > 0 and time.time() - last_check > 60 and (SERVER / "paper.jar").exists():
                          last_check = time.time()
                          autos = [b for b in list_backups() if b["name"].startswith("auto-")]
                          if not autos or time.time() - autos[0]["mtime"] > hrs * 3600:
                              create_backup("auto")
                              prune_backups()
                  except Exception:
                      traceback.print_exc()


          # ───────────────────────── HTTP ─────────────────────────
          ROUTES, SESSIONS, FAILS = {}, {}, {}


          def route(method, path, auth=True):
              def deco(fn):
                  ROUTES[(method, path)] = (fn, auth)
                  return fn
              return deco


          class Raw:
              def __init__(self, code=200, body=b"", ctype="application/json", headers=None, path=None, name=None):
                  self.code, self.body, self.ctype, self.headers, self.path, self.name = code, body, ctype, headers or [], path, name

              def send(self, h):
                  if self.path:
                      size = self.path.stat().st_size
                      h.send_response(200)
                      h.send_header("Content-Type", "application/octet-stream")
                      h.send_header("Content-Length", str(size))
                      h.send_header("Content-Disposition", "attachment; filename*=UTF-8''" + urllib.parse.quote(self.name or self.path.name))
                      h.send_header("X-Content-Type-Options", "nosniff")
                      h.end_headers()
                      with open(self.path, "rb") as f:
                          shutil.copyfileobj(f, h.wfile, 1 << 16)
                  else:
                      h._send(self.code, self.body, self.ctype, self.headers)


          class Ctx:
              def __init__(self, h, q, body):
                  self.h, self.q, self.body = h, q, body


          CSP = ("default-src 'self'; img-src 'self' https://cdn.modrinth.com data:; style-src 'self' 'unsafe-inline'; "
                 "script-src 'self'; frame-ancestors 'none'")


          class H(BaseHTTPRequestHandler):
              server_version = "McPanel"
              protocol_version = "HTTP/1.0"

              def log_message(self, *a):
                  pass

              def _send(self, code, body=b"", ctype="application/json", extra=None):
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("Content-Security-Policy", CSP)
                  for k, v in extra or []:
                      self.send_header(k, v)
                  self.end_headers()
                  if body and self.command != "HEAD":
                      self.wfile.write(body)

              def _json(self, code, obj):
                  self._send(code, json.dumps(obj).encode())

              def _host_ok(self):
                  if load_cfg()["bind"] != "127.0.0.1":
                      return True
                  host = (self.headers.get("Host") or "").rsplit(":", 1)[0].strip("[]")
                  return host in ("localhost", "127.0.0.1", "::1")

              def _authed(self):
                  m = re.search(r"(?:^|;\s*)mcp=([A-Za-z0-9_\-]+)", self.headers.get("Cookie", ""))
                  t = m and SESSIONS.get(m.group(1))
                  return bool(t and t > time.time())

              def _static(self, path):
                  if path == "/favicon.ico":
                      return self._send(204)
                  name = {"/": "index.html", "/index.html": "index.html", "/app.js": "app.js", "/app.css": "app.css"}.get(path)
                  p = STATIC / name if name else None
                  if not p or not p.is_file():
                      return self._send(404, b"Tidak ketemu", "text/plain; charset=utf-8")
                  ct = {"html": "text/html; charset=utf-8", "js": "text/javascript; charset=utf-8", "css": "text/css; charset=utf-8"}[name.rsplit(".", 1)[1]]
                  self._send(200, p.read_bytes(), ct)

              def handle_any(self):
                  try:
                      u = urllib.parse.urlsplit(self.path)
                      q = {k: v[0] for k, v in urllib.parse.parse_qs(u.query).items()}
                      if not self._host_ok():
                          return self._json(403, {"error": "Host tidak diizinkan"})
                      if not u.path.startswith("/api/"):
                          return self._static(u.path)
                      r = ROUTES.get((self.command, u.path))
                      if not r:
                          return self._json(404, {"error": "Endpoint tidak ada"})
                      fn, auth = r
                      if auth and not self._authed():
                          return self._json(401, {"error": "Belum login"})
                      if self.command != "GET" and self.headers.get("X-Panel") != "1":
                          return self._json(403, {"error": "Permintaan ditolak (header X-Panel hilang)"})
                      body = {}
                      if self.command == "POST":
                          n = to_int(self.headers.get("Content-Length"), 0)
                          if n > 5_000_000:
                              raise ApiError(413, "Isi permintaan terlalu besar")
                          raw = self.rfile.read(n) if n else b""
                          body = json.loads(raw) if raw else {}
                          if not isinstance(body, dict):
                              raise ApiError(400, "JSON harus berupa objek")
                      res = fn(Ctx(self, q, body))
                      if isinstance(res, Raw):
                          return res.send(self)
                      self._json(200, res if res is not None else {"ok": True})
                  except ApiError as e:
                      self._json(e.code, {"error": e.msg})
                  except urllib.error.HTTPError as e:
                      self._json(502, {"error": f"Server luar menjawab {e.code}: {e.url}"})
                  except urllib.error.URLError as e:
                      self._json(502, {"error": f"Tidak bisa terhubung ke server luar (cek internet): {e.reason}"})
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      self._json(400, {"error": "JSON tidak valid"})
                  except (BrokenPipeError, ConnectionResetError):
                      pass
                  except Exception as e:
                      traceback.print_exc()
                      try:
                          self._json(500, {"error": f"Error internal: {e}"})
                      except Exception:
                          pass

              do_GET = do_POST = do_PUT = do_HEAD = handle_any


          class Srv(ThreadingHTTPServer):
              daemon_threads = True
              allow_reuse_address = True


          # ── rute: sesi
          @route("GET", "/api/session", auth=False)
          def api_session(c):
              return {"authed": c.h._authed(), "configured": bool(load_cfg()["pw_hash"])}


          @route("POST", "/api/login", auth=False)
          def api_login(c):
              ip = c.h.client_address[0]
              f = FAILS.get(ip, [0, 0])
              if f[1] > time.time():
                  raise ApiError(429, "Terlalu banyak percobaan. Tunggu 30 detik.")
              if not check_password(str(c.body.get("password", ""))):
                  f[0] += 1
                  if f[0] >= 5:
                      f = [0, time.time() + 30]
                  FAILS[ip] = f
                  raise ApiError(401, "Password salah")
              FAILS.pop(ip, None)
              tok = secrets.token_urlsafe(32)
              SESSIONS[tok] = time.time() + 30 * 86400
