          cat > app/assets/app.js <<'__EOF_APP_JS__'
          'use strict';
          const $ = (s, r = document) => r.querySelector(s);

          function h(tag, attrs, ...kids) {
            const el = document.createElement(tag);
            const late = {};
            for (const [k, v] of Object.entries(attrs || {})) {
              if (v == null || v === false) continue;
              if (k === 'class') el.className = v;
              else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
              else if (k === 'value' || k === 'checked') late[k] = v;
              else el.setAttribute(k, v === true ? '' : v);
            }
            for (const kid of kids.flat(Infinity)) {
              if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
            }
            for (const [k, v] of Object.entries(late)) el[k] = v;
            return el;
          }

          const LABEL = { running: 'Berjalan', starting: 'Menyala…', stopping: 'Berhenti…', stopped: 'Mati' };
          const TABS = [['dash', 'Ringkasan'], ['console', 'Konsol'], ['players', 'Pemain'], ['plugins', 'Plugin'], ['files', 'File'],
            ['backups', 'Backup'], ['bedrock', 'Bedrock'], ['tunnel', 'Tunnel'], ['settings', 'Pengaturan']];
          const S = { st: null, timers: [], onStatus: null, poll: null };

          const fmtB = n => n == null ? '-' : n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB'
            : n < 1073741824 ? (n / 1048576).toFixed(1) + ' MB' : (n / 1073741824).toFixed(2) + ' GB';
          const fmtDur = s => {
            s = Math.max(0, Math.floor(s));
            const d = Math.floor(s / 86400), j = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
            return (d ? d + ' hari ' : '') + (j ? j + ' jam ' : '') + m + ' menit';
          };
          const fmtT = t => new Date(t * 1000).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });

          function toast(msg, bad) {
            const t = h('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
            $('#toasts').append(t);
            setTimeout(() => t.remove(), bad ? 7000 : 3200);
          }

          function modal(title, body, actions) {
            const close = () => m.remove();
            const m = h('div', { class: 'modal', onclick: e => { if (e.target === m) close(); } },
              h('div', { class: 'box' },
                h('div', { class: 'row sp' }, h('h2', {}, title), h('button', { class: 'btn small ghost', onclick: close }, 'Tutup')),
                body,
                h('div', { class: 'row', style: 'margin-top:12px' }, (actions || []).map(a =>
                  h('button', {
                    class: 'btn ' + (a.cls || ''), onclick: async ev => {
                      const b = ev.currentTarget; b.disabled = true;
                      try { await a.fn(close); } catch (e) { toast(e.message, true); } finally { b.disabled = false; }
                    }
                  }, a.label)))));
            document.body.append(m);
            return close;
          }

          async function api(method, path, body, raw) {
            const opt = { method, headers: { 'X-Panel': '1' }, credentials: 'same-origin' };
            if (raw) opt.body = raw;
            else if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
            let r;
            try { r = await fetch(path, opt); } catch (e) { throw new Error('Tidak bisa menghubungi panel. Pastikan Termux masih jalan.'); }
            let j = {};
            try { j = await r.json(); } catch (e) { /* bukan JSON */ }
            if (r.status === 401 && path !== '/api/login') { showLogin(); throw new Error('Silakan masuk lagi'); }
            if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
            return j;
          }

          async function upload(dir, file) {
            let r;
            try {
              r = await fetch('/api/files/upload?path=' + encodeURIComponent(dir) + '&name=' + encodeURIComponent(file.name),
                { method: 'PUT', headers: { 'X-Panel': '1' }, body: file, credentials: 'same-origin' });
            } catch (e) { throw new Error('Unggahan gagal. Cek koneksi ke panel.'); }
            const j = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(j.error || 'Unggahan gagal');
            return j;
          }

          function pickFile(accept, cb) {
            const i = h('input', { type: 'file', accept: accept || null, style: 'display:none' });
            i.addEventListener('change', () => { if (i.files[0]) cb(i.files[0]); i.remove(); });
            document.body.append(i);
            i.click();
          }

          async function run(fn, ok, btn) {
            if (btn) btn.disabled = true;
            try {
              const r = await fn();
              if (ok) toast(typeof ok === 'function' ? ok(r) : ok);
              return r;
            } catch (e) { toast(e.message, true); } finally {
              if (btn) btn.disabled = false;
              refreshStatus();
            }
          }
          const act = (fn, ok) => ev => run(fn, ok, ev.currentTarget);

          async function refreshStatus() {
            try { S.st = await api('GET', '/api/status'); } catch (e) { return; }
            const p = $('#pill');
            if (p) { p.className = 'pill ' + S.st.state; p.textContent = LABEL[S.st.state]; }
            if (S.onStatus) S.onStatus(S.st);
          }
          const every = (ms, fn) => S.timers.push(setInterval(fn, ms));
          function reset() { S.timers.forEach(clearInterval); S.timers = []; S.onStatus = null; }
          const kv = (k, v) => h('div', { class: 'kv' }, h('span', {}, k), h('b', {}, v));

          // ─────────── Ringkasan
          function pageDash() {
            const box = h('div');
            $('#view').replaceChildren(box);
            let key = '';
            S.onStatus = s => {
              const k = JSON.stringify([s.state, s.players, s.paper_installed, s.eula, s.contact_set, s.lan_ip, s.geyser,
                s.crashed, s.java_port, s.bedrock_port, s.mc_version, s.crash_log]);
              if (k !== key) { key = k; box.replaceChildren(...dashStruct(s)); }
              dashLive(s);
            };
            if (S.st) S.onStatus(S.st);
          }

          function meter(pct) {
            const on = Math.round(pct / 5);
            return h('div', { class: 'meter' + (pct > 85 ? ' max' : pct > 65 ? ' hot' : '') },
              Array.from({ length: 20 }, (_, i) => h('i', { class: i < on ? 'on' : '' })));
          }

          function dashStruct(s) {
            const on = s.state !== 'stopped', out = [];
            out.push(h('section', { class: 'slab ' + s.state },
              h('div', { class: 'slab-state' }, LABEL[s.state]),
              h('div', { class: 'slab-sub', id: 'd-sub' }),
              h('div', { class: 'row' },
                !on && h('button', { class: 'btn primary big', onclick: act(() => api('POST', '/api/server/start'), 'Server dijalankan') }, 'Mulai server'),
                on && h('button', { class: 'btn big', onclick: act(() => api('POST', '/api/server/stop'), 'Menghentikan server…') }, 'Hentikan'),
                on && h('button', { class: 'btn', onclick: act(() => api('POST', '/api/server/restart'), 'Memulai ulang…') }, 'Restart'),
                on && h('button', {
                  class: 'btn danger', onclick: ev => confirm('Paksa berhenti? Dunia yang belum tersimpan bisa hilang.')
                    && run(() => api('POST', '/api/server/kill'), 'Dipaksa berhenti', ev.currentTarget)
                }, 'Paksa berhenti'))));
            if (s.crash_log) {
              out.push(h('div', { class: 'note bad' }, h('b', {}, 'Server berhenti dengan error. '), 'Output terakhir:',
                h('pre', { class: 'out' }, s.crash_log)));
            }
            if (!s.paper_installed || !s.eula || !s.contact_set) out.push(setupCard(s));
            out.push(h('div', { class: 'card' }, h('h2', {}, 'Alamat untuk join'),
              kv('Java di HP ini', 'localhost:' + s.java_port),
              kv('Java dari Wi-Fi yang sama', (s.lan_ip || '(IP tidak terdeteksi)') + ':' + s.java_port),
              s.geyser.geyser ? [kv('Bedrock, alamat', s.lan_ip || '(IP tidak terdeteksi)'), kv('Bedrock, port (UDP)', String(s.bedrock_port))]
                : h('p', {}, 'Bedrock belum aktif. Pasang Geyser di tab Bedrock.'),
              h('p', { class: 'small' }, 'Teman di luar Wi-Fi? Pakai tab Tunnel.')));
            out.push(h('div', { class: 'card' }, h('h2', {}, 'Sumber daya'), h('div', { id: 'd-res' })));
            out.push(h('div', { class: 'card' }, h('h2', {}, 'Pemain online'),
              s.players.length ? h('div', {}, s.players.map(p => h('span', { class: 'tag' }, p))) : h('p', {}, 'Belum ada pemain.')));
            return out;
          }

          function setupCard(s) {
            const contact = h('input', { class: 'inp', placeholder: 'Email atau URL kontakmu', autocapitalize: 'off' });
            return h('div', { class: 'card' }, h('h2', {}, 'Persiapan awal'),
              !s.contact_set && h('div', {}, h('label', { class: 'f' }, 'Kontak untuk unduhan Paper (wajib oleh PaperMC, hanya dikirim ke PaperMC)'),
                h('div', { class: 'row' }, h('div', { class: 'grow' }, contact),
                  h('button', { class: 'btn', onclick: act(() => api('POST', '/api/settings', { contact: contact.value }), 'Kontak tersimpan') }, 'Simpan'))),
              !s.paper_installed && h('div', {}, h('label', { class: 'f' }, 'Pasang Paper (server Java) versi stabil terbaru'),
                h('button', {
                  class: 'btn primary', onclick: act(async () => {
                    const r = await api('POST', '/api/paper/install', {});
                    if (!r.java_ok) toast('Java ' + r.java + ' belum terpasang. Di Termux jalankan: pkg install openjdk-' + r.java, true);
                    return r;
                  }, r => 'Paper ' + r.version + ' terpasang')
                }, 'Unduh dan pasang Paper')),
              !s.eula && h('div', {}, h('label', { class: 'f' }, 'Minecraft EULA'),
                h('p', {}, 'Dengan lanjut, kamu setuju dengan ', h('a', { href: 'https://aka.ms/MinecraftEULA', target: '_blank', rel: 'noopener' }, 'Minecraft EULA'), '.'),
                h('button', { class: 'btn', onclick: act(() => api('POST', '/api/eula', { accept: true }), 'EULA disetujui') }, 'Saya setuju')));
          }

          function dashLive(s) {
            const sub = $('#d-sub');
            if (sub) {
              sub.textContent = s.state === 'stopped'
                ? (s.paper_installed ? 'Paper ' + (s.mc_version || '') + ' siap dijalankan' : 'Belum ada server terpasang')
                : 'Paper ' + s.mc_version + (s.paper_build ? ' build ' + s.paper_build : '') + ', aktif ' + fmtDur(s.uptime)
                  + ', ' + s.players.length + ' dari ' + s.max_players + ' pemain';
            }
            const res = $('#d-res');
            if (!res) return;
            const pct = s.rss_mb != null && s.ram_mb ? Math.min(100, s.rss_mb / s.ram_mb * 100) : 0;
            res.replaceChildren(
              kv('RAM server', s.rss_mb != null ? s.rss_mb + ' dari ' + s.ram_mb + ' MB' : 'server mati'), meter(pct),
              kv('CPU server', s.cpu != null ? s.cpu + '%' : '-'),
              kv('RAM HP yang tersisa', s.mem_avail != null ? s.mem_avail + ' dari ' + s.mem_total + ' MB' : '-'),
              kv('Penyimpanan kosong', fmtB(s.disk_free_mb * 1048576)));
          }

          // ─────────── Konsol
          function pageConsole() {
            const log = h('pre', { class: 'log' });
            const inp = h('input', {
              class: 'inp', placeholder: 'Ketik perintah, mis. list', autocomplete: 'off', autocapitalize: 'off',
              spellcheck: 'false', enterkeyhint: 'send'
            });
            let since = 0, busy = false;
            const add = (t, cls) => {
              const near = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
              const c = cls || (/ERROR|Exception|FATAL/.test(t) ? 'e' : /WARN/.test(t) ? 'w' : /^\[panel\]|Done \(/.test(t) ? 'n' : '');
              log.append(h('div', { class: c }, t));
              while (log.childElementCount > 1500) log.firstChild.remove();
              if (near) log.scrollTop = log.scrollHeight;
            };
            const poll = async () => {
              if (busy) return;
              busy = true;
              try { const r = await api('GET', '/api/console?since=' + since); r.lines.forEach(([, t]) => add(t)); since = r.next; } catch (e) { /* diam */ }
              busy = false;
            };
            const send = async () => {
              const v = inp.value.trim();
              if (!v) return;
              inp.value = '';
              add('> ' + v, 'echo');
              try { await api('POST', '/api/server/command', { cmd: v }); } catch (e) { toast(e.message, true); }
            };
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
            const quick = ['list', 'save-all', 'tps', 'say Halo semua!'].map(c =>
              h('button', { class: 'btn small', onclick: () => { inp.value = c; send(); } }, c));
            $('#view').replaceChildren(h('div', { class: 'card' }, log,
              h('div', { class: 'row', style: 'margin-top:10px' }, h('div', { class: 'grow' }, inp), h('button', { class: 'btn primary', onclick: send }, 'Kirim')),
              h('div', { class: 'row', style: 'margin-top:8px' }, quick)));
            poll();
            every(1000, poll);
          }

          // ─────────── Pemain
          function pagePlayers() {
            const box = h('div');
            $('#view').replaceChildren(box);
            const name = h('input', { class: 'inp', placeholder: 'Nama pemain (Bedrock diawali titik, mis. .Budi)', autocapitalize: 'off', spellcheck: 'false' });
            const cmd = (a, n) => run(() => api('POST', '/api/players/action', { action: a, name: n }), 'Perintah dikirim: ' + a + ' ' + n);
            let key = '';
            S.onStatus = s => {
              const k = JSON.stringify([s.players, s.state, s.max_players]);
              if (k === key) return;
              key = k;
              box.replaceChildren(
                h('div', { class: 'card' }, h('h2', {}, 'Pemain online (' + s.players.length + ' dari ' + s.max_players + ')'),
                  s.players.length ? h('div', { class: 'list' }, s.players.map(p => h('div', { class: 'it' }, h('span', { class: 'nm' }, p),
                    h('button', { class: 'btn small', onclick: () => cmd('op', p) }, 'Jadikan OP'),
                    h('button', { class: 'btn small', onclick: () => cmd('kick', p) }, 'Tendang'),
                    h('button', { class: 'btn small danger', onclick: () => confirm('Ban ' + p + '?') && cmd('ban', p) }, 'Ban'))))
                    : h('p', {}, s.state === 'stopped' ? 'Server sedang mati.' : 'Belum ada pemain online.')),
                h('div', { class: 'card' }, h('h2', {}, 'Kelola berdasarkan nama'), name,
                  h('div', { class: 'row', style: 'margin-top:10px' },
                    [['op', 'Jadikan OP'], ['deop', 'Cabut OP'], ['wl-add', 'Tambah whitelist'], ['wl-remove', 'Hapus whitelist'], ['ban', 'Ban'], ['pardon', 'Unban']]
                      .map(([a, l]) => h('button', { class: 'btn small', onclick: () => name.value.trim() ? cmd(a, name.value.trim()) : toast('Isi nama pemain dulu', true) }, l))),
                  h('p', { class: 'small' }, 'Whitelist hanya berlaku kalau diaktifkan di Pengaturan, bagian properti server.')));
            };
            if (S.st) S.onStatus(S.st);
          }

          // ─────────── Plugin
          function pagePlugins() {
            const inst = h('div', { class: 'card' }), found = h('div', { class: 'card' });
            $('#view').replaceChildren(h('div', {}, inst, found));
            const q = h('input', { class: 'inp', placeholder: 'Cari plugin di Modrinth, mis. EssentialsX', enterkeyhint: 'search' });
            const compat = h('input', { type: 'checkbox', checked: true });
            const results = h('div', { class: 'list' });

            const load = async () => {
              try {
                const r = await api('GET', '/api/plugins');
                inst.replaceChildren(
                  h('div', { class: 'row sp' }, h('h2', {}, 'Terpasang (' + r.plugins.length + ')'),
                    h('button', { class: 'btn small', onclick: () => pickFile('.jar', f => run(async () => { await upload('plugins', f); await load(); }, 'Plugin diunggah. Restart server agar dimuat.')) }, 'Unggah .jar')),
                  r.plugins.length ? h('div', { class: 'list' }, r.plugins.map(p => h('div', { class: 'it' },
                    h('div', { class: 'nm' }, h('b', {}, p.name), ' ', h('span', { class: 'mut small' }, p.version),
                      h('div', { class: 'mut small' }, p.file + ', ' + fmtB(p.size) + (p.enabled ? '' : ', nonaktif'))),
                    h('button', { class: 'btn small', onclick: ev => run(async () => { await api('POST', '/api/plugins/toggle', { file: p.file }); await load(); }, 'Diubah. Restart server agar berlaku.', ev.currentTarget) }, p.enabled ? 'Nonaktifkan' : 'Aktifkan'),
                    h('button', { class: 'btn small danger', onclick: ev => confirm('Hapus ' + p.file + '?') && run(async () => { await api('POST', '/api/plugins/delete', { file: p.file }); await load(); }, 'Dihapus', ev.currentTarget) }, 'Hapus'))))
                    : h('p', {}, 'Belum ada plugin.'),
                  h('p', { class: 'small' }, 'Plugin dimuat saat server menyala. Setelah memasang atau mengubah plugin, restart server.'));
              } catch (e) { toast(e.message, true); }
            };

            const search = async () => {
              results.replaceChildren(h('p', {}, 'Mencari…'));
              try {
                const r = await api('GET', '/api/plugins/search?q=' + encodeURIComponent(q.value.trim()) + '&compat=' + (compat.checked ? 1 : 0));
                results.replaceChildren(...(r.hits.length ? r.hits.map(hit => h('div', { class: 'it' },
                  hit.icon && /^https:\/\/cdn\.modrinth\.com\//.test(hit.icon) ? h('img', { src: hit.icon, alt: '' }) : null,
                  h('div', { class: 'nm' }, h('b', {}, hit.title), h('div', { class: 'mut small' }, hit.desc)),
                  h('button', {
                    class: 'btn small primary', onclick: ev => run(async () => { const x = await api('POST', '/api/plugins/install', { project: hit.id }); await load(); return x; },
                      x => 'Terpasang: ' + x.installed.join(', ') + '. Restart server.', ev.currentTarget)
                  }, 'Pasang')))
                  : [h('p', {}, 'Tidak ada hasil. Coba matikan filter versi Minecraft.')]));
              } catch (e) { results.replaceChildren(h('div', { class: 'note bad' }, e.message)); }
            };
            q.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
            found.replaceChildren(h('h2', {}, 'Cari di Modrinth'), q,
              h('label', { class: 'sw' }, compat, 'Hanya yang cocok dengan versi Minecraft server'),
              h('button', { class: 'btn primary', onclick: search }, 'Cari'), results);
            load();
            search();
          }

          // ─────────── File
          async function edit(path) {
            try {
              const r = await api('GET', '/api/files/read?path=' + encodeURIComponent(path));
              const ta = h('textarea', { spellcheck: 'false', value: r.content });
              modal(path, ta, [{
                label: 'Simpan', cls: 'primary', fn: async close => {
                  await api('POST', '/api/files/write', { path, content: ta.value });
                  toast('Tersimpan. Restart server kalau ini file konfigurasi.');
                  close();
                }
              }]);
            } catch (e) { toast(e.message, true); }
          }

          function pageFiles() {
            const box = h('div', { class: 'card' });
            $('#view').replaceChildren(box);
            let cur = '';
            const join = (a, b) => a ? a + '/' + b : b;
            const load = async p => {
              try { const r = await api('GET', '/api/files?path=' + encodeURIComponent(p)); cur = r.path; draw(r); } catch (e) { toast(e.message, true); }
            };
            const draw = r => {
              const parts = cur ? cur.split('/') : [];
              box.replaceChildren(
                h('div', { class: 'crumbs' }, h('a', { onclick: () => load('') }, 'server'),
                  parts.map((p, i) => [' / ', h('a', { onclick: () => load(parts.slice(0, i + 1).join('/')) }, p)])),
                h('div', { class: 'row', style: 'margin-bottom:8px' },
                  h('button', { class: 'btn small', onclick: async () => { const n = prompt('Nama folder baru'); if (n) { await run(() => api('POST', '/api/files/mkdir', { path: join(cur, n) })); load(cur); } } }, 'Folder baru'),
                  h('button', { class: 'btn small', onclick: () => pickFile('', async f => { await run(() => upload(cur, f), 'Diunggah'); load(cur); }) }, 'Unggah file')),
                h('div', { class: 'list' },
                  cur ? h('div', { class: 'it' }, h('a', { class: 'nm', onclick: () => load(parts.slice(0, -1).join('/')) }, '.. (naik satu folder)')) : null,
                  r.items.map(it => h('div', { class: 'it' },
                    h('a', { class: 'nm', onclick: () => it.dir ? load(join(cur, it.name)) : edit(join(cur, it.name)) }, (it.dir ? '[folder] ' : '') + it.name),
                    h('span', { class: 'mut small' }, it.dir ? '' : fmtB(it.size)),
                    !it.dir && h('a', { class: 'btn small', href: '/api/files/download?path=' + encodeURIComponent(join(cur, it.name)) }, 'Unduh'),
                    h('button', { class: 'btn small', onclick: async () => { const n = prompt('Nama baru', it.name); if (n && n !== it.name) { await run(() => api('POST', '/api/files/rename', { path: join(cur, it.name), to: join(cur, n) })); load(cur); } } }, 'Ganti nama'),
                    h('button', { class: 'btn small danger', onclick: async () => { if (confirm('Hapus ' + it.name + (it.dir ? ' beserta isinya' : '') + '?')) { await run(() => api('POST', '/api/files/delete', { path: join(cur, it.name) }), 'Dihapus'); load(cur); } } }, 'Hapus')))));
            };
            load('');
          }

          // ─────────── Backup
          function pageBackups() {
            const box = h('div');
            $('#view').replaceChildren(box);
            const plug = h('input', { type: 'checkbox', checked: true });
            const load = async () => {
              try {
                const r = await api('GET', '/api/backups');
                box.replaceChildren(
                  h('div', { class: 'card' }, h('h2', {}, 'Buat backup'),
                    h('p', {}, 'Isi: dunia, pengaturan server, daftar OP, whitelist, dan ban. Aman dibuat saat server menyala.'),
                    h('label', { class: 'sw' }, plug, 'Sertakan data plugin (tanpa file .jar)'),
                    h('button', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/backups/create', { plugins: plug.checked }); await load(); }, 'Backup selesai', ev.currentTarget) }, 'Buat backup sekarang')),
                  h('div', { class: 'card' }, h('h2', {}, 'Daftar backup (' + r.backups.length + ')'),
                    r.backups.length ? h('div', { class: 'list' }, r.backups.map(b => h('div', { class: 'it' },
                      h('div', { class: 'nm' }, b.name, h('div', { class: 'mut small' }, fmtT(b.mtime) + ', ' + fmtB(b.size))),
                      h('a', { class: 'btn small', href: '/api/backups/download?name=' + encodeURIComponent(b.name) }, 'Unduh'),
                      h('button', { class: 'btn small', onclick: ev => confirm('Pulihkan ' + b.name + '? Dunia saat ini dipindah ke folder _before-restore.') && run(() => api('POST', '/api/backups/restore', { name: b.name }), 'Dipulihkan. Silakan nyalakan server.', ev.currentTarget) }, 'Pulihkan'),
                      h('button', { class: 'btn small danger', onclick: ev => confirm('Hapus backup ini?') && run(async () => { await api('POST', '/api/backups/delete', { name: b.name }); await load(); }, 'Dihapus', ev.currentTarget) }, 'Hapus'))))
                      : h('p', {}, 'Belum ada backup.')));
              } catch (e) { toast(e.message, true); }
