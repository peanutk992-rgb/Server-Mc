                t.addresses.length ? h('div', {}, h('p', {}, 'Alamat tunnel yang terdeteksi:'), t.addresses.map(a => h('span', { class: 'tag' }, a))) : null,
                t.output ? h('pre', { class: 'out' }, t.output) : null));
            };
            try { await load(); } catch (e) { toast(e.message, true); }
          }

          // ─────────── Pengaturan
          const PROPS = [
            ['motd', 'Nama server (MOTD)', 'text'], ['max-players', 'Maksimal pemain', 'num'],
            ['difficulty', 'Kesulitan', ['peaceful', 'easy', 'normal', 'hard']], ['gamemode', 'Mode game', ['survival', 'creative', 'adventure', 'spectator']],
            ['online-mode', 'Wajib akun Java asli (online-mode)', 'bool'], ['white-list', 'Whitelist', 'bool'], ['pvp', 'PvP', 'bool'],
            ['allow-flight', 'Boleh terbang', 'bool'], ['hardcore', 'Hardcore', 'bool'], ['view-distance', 'Jarak pandang (chunk)', 'num'],
            ['simulation-distance', 'Jarak simulasi (chunk)', 'num'], ['level-seed', 'Seed dunia', 'text'],
            ['server-port', 'Port Java', 'num'], ['spawn-protection', 'Proteksi spawn', 'num']];
          const DEFAULT_TRUE = ['online-mode', 'pvp'];

          async function pageSettings() {
            const box = h('div');
            $('#view').replaceChildren(box);
            const load = async () => {
              const [c, pr] = await Promise.all([api('GET', '/api/settings'), api('GET', '/api/props')]);
              const f = {};
              const field = (k, label, help, type) => {
                f[k] = h('input', { class: 'inp', type: type || 'text', value: c[k], autocapitalize: 'off', spellcheck: 'false' });
                return h('div', {}, h('label', { class: 'f' }, label), f[k], help ? h('p', { class: 'small' }, help) : null);
              };
              const auto = h('input', { type: 'checkbox', checked: !!c.auto_restart });
              const bind = h('select', { value: c.bind },
                h('option', { value: '127.0.0.1' }, 'Hanya di HP ini (aman)'),
                h('option', { value: '0.0.0.0' }, 'Bisa dibuka dari Wi-Fi (pakai password kuat)'));
              const saveCfg = ev => run(() => api('POST', '/api/settings', {
                ram_mb: f.ram_mb.value, jvm_flags: f.jvm_flags.value, contact: f.contact.value, backup_every_h: f.backup_every_h.value,
                backup_keep: f.backup_keep.value, java: f.java.value, upload_max_mb: f.upload_max_mb.value, auto_restart: auto.checked, bind: bind.value
              }), 'Tersimpan. RAM dan JVM berlaku saat server dijalankan ulang.', ev.currentTarget);

              const pf = {};
              const propRows = PROPS.map(([k, label, kind]) => {
                const cur = pr.props[k] ?? '';
                let el, init;
                if (kind === 'bool') {
                  init = cur === '' ? DEFAULT_TRUE.includes(k) : cur === 'true';
                  el = h('input', { type: 'checkbox', checked: init });
                } else if (Array.isArray(kind)) {
                  init = cur;
                  el = h('select', { value: cur }, h('option', { value: '' }, '(bawaan)'), kind.map(o => h('option', { value: o }, o)));
                } else {
                  init = cur;
                  el = h('input', { class: 'inp', type: kind === 'num' ? 'number' : 'text', value: cur, placeholder: 'bawaan' });
                }
                pf[k] = { el, kind, init };
                return kind === 'bool'
                  ? h('div', {}, h('label', { class: 'sw' }, el, label),
                    k === 'online-mode' ? h('p', { class: 'small' }, 'Matikan hanya untuk pemain non-premium. Siapa pun bisa memakai nama pemain lain, jadi aktifkan whitelist.') : null)
                  : h('div', {}, h('label', { class: 'f' }, label), el);
              });
              const saveProps = ev => run(async () => {
                const changes = {};
                for (const [k, { el, kind, init }] of Object.entries(pf)) {
                  if (kind === 'bool') { if (el.checked !== init) changes[k] = String(el.checked); }
                  else if (el.value !== init) changes[k] = el.value;
                }
                if (!Object.keys(changes).length) return toast('Tidak ada yang berubah');
                await api('POST', '/api/props', { changes });
                toast('Properti tersimpan. Restart server agar berlaku.');
              }, null, ev.currentTarget);

              const ver = h('select', {}, h('option', { value: '' }, c.mc_version ? 'Versi sekarang: ' + c.mc_version : 'Pilih versi'));
              const pw = h('input', { class: 'inp', type: 'password', placeholder: 'Password baru (minimal 6 karakter)', autocomplete: 'new-password' });

              box.replaceChildren(
                h('div', { class: 'card' }, h('h2', {}, 'Server'),
                  field('ram_mb', 'RAM untuk server (MB)', 'HP ini punya ' + (c.mem_total || '?') + ' MB. Pakai maksimal sekitar 60% supaya Android tidak mematikan Termux.', 'number'),
                  field('jvm_flags', 'Opsi JVM tambahan'), field('java', 'Lokasi Java (kosongkan untuk otomatis)'),
                  field('contact', 'Kontak untuk unduhan Paper (email atau URL)'),
                  h('label', { class: 'sw' }, auto, 'Jalankan ulang otomatis kalau server crash'),
                  field('backup_every_h', 'Backup otomatis tiap berapa jam (0 = mati)', null, 'number'),
                  field('backup_keep', 'Simpan berapa backup otomatis', null, 'number'),
                  field('upload_max_mb', 'Batas ukuran unggahan (MB)', null, 'number'),
                  h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: saveCfg }, 'Simpan pengaturan'))),
                h('div', { class: 'card' }, h('h2', {}, 'Properti server'), propRows,
                  h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn primary', onclick: saveProps }, 'Simpan properti')),
                  h('p', { class: 'small' }, 'Properti lain bisa diedit di tab File, file server.properties.')),
                h('div', { class: 'card' }, h('h2', {}, 'Versi Paper'),
                  h('p', {}, c.mc_version ? 'Terpasang Minecraft ' + c.mc_version + ' (butuh Java ' + c.java_needed + ').' : 'Paper belum terpasang.'), ver,
                  h('div', { class: 'row', style: 'margin-top:10px' },
                    h('button', { class: 'btn', onclick: ev => run(async () => { const r = await api('GET', '/api/paper/versions'); ver.replaceChildren(h('option', { value: '' }, 'Terbaru yang stabil'), r.versions.map(v => h('option', { value: v }, v))); }, null, ev.currentTarget) }, 'Lihat daftar versi'),
                    h('button', {
                      class: 'btn primary', onclick: ev => run(async () => {
                        const r = await api('POST', '/api/paper/install', { version: ver.value });
                        if (!r.java_ok) toast('Java ' + r.java + ' belum terpasang. Di Termux jalankan: pkg install openjdk-' + r.java, true);
                        await load();
                        return r;
                      }, r => 'Paper ' + r.version + ' build ' + r.build + ' terpasang', ev.currentTarget)
                    }, 'Pasang atau perbarui Paper')),
                  h('p', { class: 'small' }, 'Matikan server dulu. Buat backup sebelum ganti versi karena plugin lama bisa tidak cocok.')),
                h('div', { class: 'card' }, h('h2', {}, 'Minecraft EULA'),
                  c.eula ? h('p', {}, 'EULA sudah disetujui.') : h('div', {}, h('p', {}, 'Dengan lanjut, kamu setuju dengan ', h('a', { href: 'https://aka.ms/MinecraftEULA', target: '_blank', rel: 'noopener' }, 'Minecraft EULA'), '.'),
                    h('button', { class: 'btn', onclick: act(async () => { await api('POST', '/api/eula', { accept: true }); await load(); }, 'EULA disetujui') }, 'Saya setuju'))),
                h('div', { class: 'card' }, h('h2', {}, 'Akses panel'), bind,
                  h('p', { class: 'small' }, 'Mengubah ini perlu panel dimulai ulang. Simpan pengaturan dulu, lalu mulai ulang.'),
                  h('div', { class: 'row' }, h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/panel/restart'); setTimeout(() => location.reload(), 3500); }, 'Panel dimulai ulang…', ev.currentTarget) }, 'Mulai ulang panel'))),
                h('div', { class: 'card' }, h('h2', {}, 'Password panel'), pw,
                  h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/settings/password', { password: pw.value }); toast('Password diganti. Silakan masuk lagi.'); setTimeout(() => location.reload(), 1200); }, null, ev.currentTarget) }, 'Ganti password'))));
            };
            try { await load(); } catch (e) { toast(e.message, true); }
          }

          // ─────────── Kerangka
          const PAGES = { dash: pageDash, console: pageConsole, players: pagePlayers, plugins: pagePlugins, files: pageFiles,
            backups: pageBackups, bedrock: pageBedrock, tunnel: pageTunnel, settings: pageSettings };

          async function logout() {
            try { await api('POST', '/api/logout'); } catch (e) { /* abaikan */ }
            location.reload();
          }

          function shell() {
            $('#app').replaceChildren(
              h('header', { class: 'top' },
                h('div', { class: 'brand' }, h('span', { class: 'cube' }), h('span', {}, 'Panel server')),
                h('span', { id: 'pill', class: 'pill stopped' }, '…'),
                h('button', { class: 'btn small ghost', onclick: logout }, 'Keluar')),
              h('nav', { class: 'tabs', id: 'tabs' }, TABS.map(([k, l]) => h('a', { href: '#' + k, 'data-k': k }, l))),
              h('main', { id: 'view' }));
          }

          function go() {
            reset();
            const k = (location.hash || '#dash').slice(1);
            const key = PAGES[k] ? k : 'dash';
            document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.k === key));
            PAGES[key]();
            if (S.st && S.onStatus) S.onStatus(S.st);
          }

          function showLogin(configured) {
            reset();
            clearInterval(S.poll);
            const inp = h('input', { class: 'inp', type: 'password', placeholder: 'Password panel', autocomplete: 'current-password' });
            const enter = async () => {
              try { await api('POST', '/api/login', { password: inp.value }); start(); } catch (e) { toast(e.message, true); }
            };
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
            $('#app').replaceChildren(h('div', { class: 'login' }, h('div', { class: 'card' },
              h('h2', {}, 'Masuk ke panel server'),
              configured === false ? h('div', { class: 'note bad' }, 'Password belum dibuat. Di Termux jalankan: mc passwd') : null,
              inp, h('div', { class: 'row', style: 'margin-top:10px' }, h('button', { class: 'btn primary grow', onclick: enter }, 'Masuk')),
              h('p', { class: 'small' }, 'Lupa password? Di Termux jalankan: mc passwd'))));
            inp.focus();
          }

          async function start() {
            let s;
            try { s = await api('GET', '/api/session'); } catch (e) {
              $('#app').replaceChildren(h('div', { class: 'login' }, h('div', { class: 'card' },
                h('h2', {}, 'Panel tidak bisa dihubungi'), h('p', {}, e.message), h('button', { class: 'btn', onclick: () => location.reload() }, 'Coba lagi'))));
              return;
            }
            if (!s.authed) return showLogin(s.configured);
            shell();
            await refreshStatus();
            go();
            clearInterval(S.poll);
            S.poll = setInterval(refreshStatus, 2500);
          }

          window.addEventListener('hashchange', () => { if ($('#view')) go(); });
          start();
          __EOF_APP_JS__

          cat > app/assets/app.css <<'__EOF_APP_CSS__'
          :root{
            --bg:#1b2029; --panel:#252c38; --panel2:#2e3745; --edge:#0d1016; --hi:#44506a;
            --tx:#e9edf4; --mut:#98a4ba; --lapis:#3d6fe0; --lapis2:#5b88f0;
            --ok:#3dbd7d; --warn:#e2b53e; --bad:#d9473f;
            --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
          }
          *{box-sizing:border-box}
          html{-webkit-text-size-adjust:100%}
          body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          a{color:var(--lapis2)}
          button,input,select,textarea{font:inherit;color:inherit}
          :focus-visible{outline:3px solid var(--lapis2);outline-offset:2px}

          /* tombol bergaya GUI Minecraft: tepi terang di kiri-atas, gelap di kanan-bawah */
          .btn{cursor:pointer;border:2px solid var(--edge);background:var(--panel2);padding:9px 14px;min-height:42px;font-weight:600;border-radius:0;
            box-shadow:inset 2px 2px 0 rgba(255,255,255,.16),inset -2px -2px 0 rgba(0,0,0,.38)}
          .btn:hover{background:#38435a}
          .btn:active{box-shadow:inset 2px 2px 0 rgba(0,0,0,.38),inset -2px -2px 0 rgba(255,255,255,.1)}
          .btn:disabled{opacity:.5;cursor:not-allowed}
          a.btn{display:inline-block;text-decoration:none;color:var(--tx)}
          .btn.primary{background:var(--lapis)} .btn.primary:hover{background:var(--lapis2)}
          .btn.danger{background:#8d2e29} .btn.danger:hover{background:var(--bad)}
          .btn.ghost{background:transparent}
          .btn.small{min-height:34px;padding:5px 10px;font-size:13px}
          .btn.big{min-height:52px;padding:12px 22px;font-size:17px}

          .inp,select,textarea{width:100%;background:#12161d;border:2px solid var(--edge);border-radius:0;padding:9px 10px;min-height:42px;
            box-shadow:inset 2px 2px 0 rgba(0,0,0,.45)}
          textarea{font-family:var(--mono);font-size:13px;min-height:50vh;resize:vertical}

          .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--edge)}
          .brand{display:flex;align-items:center;gap:9px;font-weight:800;flex:1;letter-spacing:.01em}
          .cube{width:20px;height:20px;background:linear-gradient(135deg,#6bd08f 0 50%,#4a9a67 50% 100%);border:2px solid var(--edge);box-shadow:inset 2px 2px 0 rgba(255,255,255,.3)}
          .pill{padding:3px 10px;font-weight:700;font-size:13px;border:2px solid var(--edge);background:var(--panel2)}
          .pill.running{background:var(--ok);color:#06210f} .pill.starting,.pill.stopping{background:var(--warn);color:#2b2000} .pill.stopped{background:#4a5266}

          .tabs{display:flex;overflow-x:auto;background:var(--panel);border-bottom:2px solid var(--edge);position:sticky;top:0;z-index:5;scrollbar-width:none}
          .tabs::-webkit-scrollbar{display:none}
          .tabs a{padding:12px 15px;text-decoration:none;color:var(--mut);white-space:nowrap;font-weight:600;border-bottom:4px solid transparent}
          .tabs a.on{color:var(--tx);border-bottom-color:var(--ok)}
          main{max-width:920px;margin:0 auto;padding:14px 14px 60px}

          .card{background:var(--panel);border:2px solid var(--edge);padding:14px;margin:0 0 14px;box-shadow:inset 2px 2px 0 rgba(255,255,255,.06),inset -2px -2px 0 rgba(0,0,0,.3)}
          .card h2{margin:0 0 10px;font-size:16px}
          .card p{margin:6px 0;color:var(--mut)}
          .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
          .row.sp{justify-content:space-between}
          .grow{flex:1;min-width:140px}
          .mut{color:var(--mut)} .small{font-size:13px}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
          .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--edge)}
          .kv:last-child{border-bottom:0}
          .kv b{font-family:var(--mono);font-weight:600;word-break:break-all;text-align:right}
          .tag{display:inline-block;padding:2px 8px;background:var(--panel2);border:2px solid var(--edge);margin:2px;font-size:13px}

          /* blok status: satu-satunya elemen besar */
          .slab{border:3px solid var(--edge);padding:18px 16px;margin:0 0 14px;background:#2a3140;
            box-shadow:inset 4px 4px 0 rgba(255,255,255,.12),inset -4px -4px 0 rgba(0,0,0,.35)}
          .slab.running{background:#1f4a36} .slab.starting,.slab.stopping{background:#4d4020} .slab.stopped{background:#2a3140}
          .slab-state{font-size:34px;font-weight:900;letter-spacing:.01em;line-height:1.1}
          .slab-sub{color:#cdd6e6;margin:4px 0 14px;min-height:1.4em}

          /* meter ala bar XP: 20 kotak */
          .meter{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;margin:6px 0 2px}
          .meter i{height:12px;background:#12161d;border:1px solid var(--edge)}
          .meter i.on{background:var(--ok)} .meter.hot i.on{background:var(--warn)} .meter.max i.on{background:var(--bad)}

          .log{margin:0;background:#0f1319;border:2px solid var(--edge);padding:10px;height:56vh;overflow:auto;font:12.5px/1.4 var(--mono);white-space:pre-wrap;word-break:break-word}
          .log .w{color:var(--warn)} .log .e{color:#ff7a72} .log .echo{color:var(--lapis2)} .log .n{color:var(--ok)}

          .list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--edge);flex-wrap:wrap}
          .list .it:last-child{border-bottom:0}
          .it .nm{flex:1;min-width:150px;word-break:break-word}
          .it img{width:40px;height:40px;background:var(--panel2);border:2px solid var(--edge)}
          .crumbs{font-family:var(--mono);font-size:13px;margin-bottom:10px;word-break:break-all}
          .crumbs a{cursor:pointer}
          .sw{display:flex;gap:10px;align-items:center;padding:8px 0}
          .sw input{width:22px;height:22px;accent-color:var(--ok)}
          label.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
          .note{border-left:4px solid var(--warn);padding:6px 10px;background:#2c2a1d;margin:8px 0}
          .note.bad{border-color:var(--bad);background:#2f1d1d}
          .note.ok{border-color:var(--ok);background:#1b2e24}
          pre.out{background:#0f1319;border:2px solid var(--edge);padding:10px;overflow:auto;max-height:260px;font:12px/1.4 var(--mono);white-space:pre-wrap;word-break:break-all}

          .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:14px}
          .modal .box{background:var(--panel);border:3px solid var(--edge);width:100%;max-width:820px;padding:14px;margin-top:4vh}
          #toasts{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none;padding:0 12px}
          .toast{background:#202838;border:2px solid var(--edge);border-left:6px solid var(--ok);padding:10px 14px;max-width:560px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
          .toast.bad{border-left-color:var(--bad)}
          .login{max-width:380px;margin:12vh auto;padding:0 14px}
          @media (prefers-reduced-motion:no-preference){.slab.starting .slab-state::after,.slab.stopping .slab-state::after{content:"";display:inline-block;width:.5em;height:.5em;margin-left:.4em;background:var(--warn);animation:bl 1s steps(2) infinite}}
          @keyframes bl{50%{opacity:0}}
          __EOF_APP_CSS__

          echo "File sumber ditulis:"; find app -type f | sort

      - name: Bangun APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK/build-tools" ] || { echo "Android SDK tidak ketemu di $SDK"; exit 1; }
          BTV="$(ls "$SDK/build-tools" | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)"
          PLV="$(ls "$SDK/platforms" | grep -E '^android-[0-9]+$' | sort -V | tail -n1)"
          BT="$SDK/build-tools/$BTV"
          AJ="$SDK/platforms/$PLV/android.jar"
          echo "build-tools $BTV, platform $PLV"
          test -f "$AJ"
          cd app
          rm -rf build
          mkdir -p build/classes build/dex
          "$BT/aapt2" compile --dir res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$AJ" --manifest AndroidManifest.xml -A assets \
            --min-sdk-version 24 --target-sdk-version 33 --version-code 1 --version-name 1.0 build/res.zip
          javac -encoding UTF-8 -source 8 -target 8 -Xlint:-options -bootclasspath "$AJ" \
            -d build/classes $(find java -name '*.java')
          "$BT/d8" --release --lib "$AJ" --min-api 24 --output build/dex $(find build/classes -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          keytool -genkeypair -keystore build/debug.keystore -storepass android -keypass android \
            -alias servermc -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Server MC"
          "$BT/apksigner" sign --ks build/debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out ../ServerMC.apk build/aligned.apk
          "$BT/apksigner" verify --print-certs ../ServerMC.apk
          ls -l ../ServerMC.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerMC-apk
          path: ServerMC.apk
          if-no-files-found: error

      - name: Terbitkan di Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-${{ github.run_number }}
          name: Server MC build ${{ github.run_number }}
          body: APK Server MC. Pasang, lalu ikuti langkah 1 sampai 3 di layar aplikasi.
          files: ServerMC.apk
