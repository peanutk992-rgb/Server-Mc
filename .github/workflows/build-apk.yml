                  h('p', {}, 'Di Minecraft Bedrock: Play, Servers, Add Server, lalu isi alamat dan port di atas. Perangkat harus satu Wi-Fi dengan HP ini. Dari luar Wi-Fi, pakai tab Tunnel.')));
