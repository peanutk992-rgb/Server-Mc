          // ─────────── Tunnel
          async function pageTunnel() {
            const box = h('div');
            $('#view').replaceChildren(box);
            const load = async () => {
              const t = await api('GET', '/api/tunnel');
              box.replaceChildren(h('div', { class: 'card' }, h('h2', {}, 'Tunnel playit.gg'),
                h('p', {}, 'Supaya teman di luar Wi-Fi bisa join tanpa membuka port router. Perlu akun gratis di playit.gg. Fitur ini masih eksperimental di Termux.'),
                !t.installed && h('button', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/tunnel/install'); await load(); }, 'Agent playit terpasang', ev.currentTarget) }, 'Pasang agent playit'),
                t.installed && h('div', { class: 'row' },
                  !t.running && h('button', { class: 'btn primary', onclick: ev => run(async () => { await api('POST', '/api/tunnel/start'); setTimeout(load, 2500); }, 'Tunnel dijalankan', ev.currentTarget) }, 'Jalankan tunnel'),
                  t.running && h('button', { class: 'btn', onclick: ev => run(async () => { await api('POST', '/api/tunnel/stop'); await load(); }, 'Tunnel dihentikan', ev.currentTarget) }, 'Hentikan tunnel'),
                  h('button', { class: 'btn small ghost', onclick: () => load() }, 'Segarkan')),
                t.installed && !t.chroot && h('div', { class: 'note' }, 'termux-chroot tidak ada. Di Termux jalankan: pkg install proot resolv-conf'),
