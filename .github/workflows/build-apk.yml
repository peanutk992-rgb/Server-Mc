          def backup_members(with_plugins=True):
              ln = read_props().get("level-name") or "world"
              keep = ("server.properties", "ops.json", "whitelist.json", "banned-players.json", "banned-ips.json",
                      "bukkit.yml", "spigot.yml", "config", "usercache.json")
              out = []
