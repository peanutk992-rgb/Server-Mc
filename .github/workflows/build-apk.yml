          def safe_path(rel, root=None):
              root = (root or SERVER).resolve()
              rel = str(rel or "").lstrip("/")
              p = (root / rel).resolve()
              if p != root and root not in p.parents:
                  raise ApiError(403, "Path di luar folder server tidak diizinkan")
