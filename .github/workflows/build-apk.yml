# ======================================================================
#  SERVER MC - workflow GitHub Actions yang membangun APK
#
#  Isi file ini sudah lengkap: source aplikasi Android, panel server, dan
#  pemasang Termux. Tidak ada file lain yang perlu diunggah.
#
#  Cara pakai (bisa dari HP, lewat situs github.com):
#   1. Buat repository baru di GitHub (boleh private).
#   2. Add file > Create new file. Nama file persis:
#        .github/workflows/build-apk.yml
#      Tempel seluruh isi file ini, lalu Commit.
#   3. Buka tab Actions > "Build APK Server MC". Build jalan otomatis setelah
#      commit (atau tekan Run workflow). Tunggu sekitar 2 sampai 4 menit.
#   4. APK ada di halaman Releases (ServerMC.apk), atau di Actions > build
#      terakhir > Artifacts (ServerMC-apk).
#   5. Pasang APK. Kalau sudah ada versi lama, copot dulu karena tanda
#      tangannya berbeda tiap build.
#
#  Aplikasi ini memasang dan mengontrol server Minecraft (Paper + Geyser)
#  yang jalan di Termux. Pasang Termux dari F-Droid, lalu ikuti langkah 1-3
#  di layar aplikasi.
# ======================================================================
name: Build APK Server MC

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tulis source aplikasi
        run: |
          set -euo pipefail
          mkdir -p app/java/id/servermc/panel app/res/drawable app/assets

          cat > app/AndroidManifest.xml <<'__EOF_ANDROIDMANIFEST_XML__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="id.servermc.panel">

              <uses-permission android:name="android.permission.INTERNET" />

              <!-- supaya aplikasi bisa mendeteksi dan membuka Termux (Android 11 ke atas) -->
              <queries>
                  <package android:name="com.termux" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic"
                  android:label="Server MC"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __EOF_ANDROIDMANIFEST_XML__

          cat > app/res/drawable/ic.xml <<'__EOF_IC_XML__'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#1B2029" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#7A5230" android:pathData="M22,30h64v56h-64z" />
              <path android:fillColor="#5A3D22" android:pathData="M30,56h12v12h-12z M62,66h12v12h-12z M46,74h10v10h-10z" />
              <path android:fillColor="#4A9A67" android:pathData="M22,30h64v22h-64z" />
              <path android:fillColor="#6BD08F" android:pathData="M22,30h64v10h-64z" />
              <path android:fillColor="#4A9A67" android:pathData="M22,52h12v10h-12z M50,52h14v8h-14z M74,52h12v12h-12z" />
          </vector>
          __EOF_IC_XML__

          cat > app/java/id/servermc/panel/MainActivity.java <<'__EOF_MAINACTIVITY_JAVA__'
          package id.servermc.panel;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.DownloadListener;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLDecoder;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              static final String PANEL = "http://127.0.0.1:8080/";
              static final int BG = 0xFF1B2029, CARD = 0xFF252C38, EDGE = 0xFF0D1016, TX = 0xFFE9EDF4, MUT = 0xFF98A4BA,
                      BLUE = 0xFF3D6FE0, GREEN = 0xFF3DBD7D, SLATE = 0xFF2E3745, DARKGREEN = 0xFF2D8A5B;
              static final int REQ_FILE = 77;
              static final String ERR_HTML = "<meta name=viewport content='width=device-width,initial-scale=1'>"
                      + "<body style='background:#1b2029;color:#e9edf4;font:16px sans-serif;padding:24px'>"
                      + "<h2>Panel belum aktif</h2>"
                      + "<p>Buka Termux lalu jalankan: <b>mc panel start</b></p>"
                      + "<p>Kalau belum pernah memasang, kembali ke menu dan pilih langkah 2.</p>"
                      + "<p><a style='color:#5b88f0' href='" + PANEL + "'>Coba lagi</a></p></body>";

              LocalServer server;
              FrameLayout root;
              ScrollView home;
              LinearLayout webBox;
              WebView web;
              TextView status, cmdView;
              ValueCallback<Uri[]> fileCb;
              boolean failed;
              final Handler ui = new Handler(Looper.getMainLooper());
              final Runnable poll = new Runnable() {
                  @Override
                  public void run() {
                      checkStatus();
                      ui.postDelayed(this, 3000);
                  }
              };

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  try {
                      server = new LocalServer(getAssets());
                      server.start();
                  } catch (Exception e) {
                      server = null;
                  }
                  root = new FrameLayout(this);
                  root.setBackgroundColor(BG);
                  buildHome();
                  buildWeb();
                  root.addView(home);
                  root.addView(webBox);
                  setContentView(root);
                  showHome();
              }

              // ───────────── tampilan
              int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              TextView tv(String s, int sp, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT_BOLD);
                  return t;
              }

              Button btn(String s, int bg, View.OnClickListener l, boolean small) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(small ? 14 : 16);
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(bg);
                  d.setStroke(dp(2), EDGE);
                  b.setBackground(d);
                  b.setPadding(dp(14), dp(small ? 6 : 12), dp(14), dp(small ? 6 : 12));
                  b.setOnClickListener(l);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          small ? ViewGroup.LayoutParams.WRAP_CONTENT : ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, dp(6), small ? dp(8) : 0, dp(6));
                  b.setLayoutParams(lp);
                  return b;
              }

              void buildHome() {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setPadding(dp(16), dp(28), dp(16), dp(36));
                  col.addView(tv("Server MC", 28, TX, true));
                  col.addView(tv("Server Minecraft Java dan Bedrock di HP kamu. Servernya jalan di Termux; aplikasi ini jadi pemasang dan panel kontrolnya.", 14, MUT, false));
                  status = tv("", 15, TX, true);
                  status.setPadding(0, dp(18), 0, dp(8));
                  col.addView(status);

                  col.addView(btn("1. Pasang Termux (F-Droid)", SLATE, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          open("https://f-droid.org/packages/com.termux/");
                      }
                  }, false));
                  col.addView(btn("2. Salin perintah pasang, lalu buka Termux", BLUE, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          installFlow();
                      }
                  }, false));
                  col.addView(btn("3. Buka panel server", DARKGREEN, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showWeb();
                      }
                  }, false));
                  col.addView(btn("Buka Termux (panel menyala otomatis)", SLATE, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          openTermux();
                      }
                  }, false));

                  cmdView = tv("", 12, GREEN, false);
                  cmdView.setTypeface(Typeface.MONOSPACE);
                  cmdView.setTextIsSelectable(true);
                  cmdView.setPadding(dp(10), dp(10), dp(10), dp(10));
                  cmdView.setBackgroundColor(0xFF0F1319);
                  col.addView(cmdView);

                  TextView help = tv("Cara pakai:\n"
                          + "1. Pasang Termux dari F-Droid (versi Play Store sudah tidak bisa dipakai).\n"
                          + "2. Tekan tombol 2, di Termux tahan layar lalu pilih Paste, tekan Enter. Jawab 2 pertanyaan (kontak dan EULA). Jangan tutup aplikasi ini sampai Termux mulai mengunduh paket.\n"
                          + "3. Setelah selesai, kembali ke sini dan tekan tombol 3.\n\n"
                          + "Pemain Bedrock join lewat Geyser: alamat IP HP dan port 19132 (UDP). Matikan penghemat baterai untuk Termux supaya server tidak dimatikan Android.\n\n"
                          + "Perintah di Termux: mc start, mc stop, mc console, mc backup, mc update, mc passwd, mc help.", 13, MUT, false);
                  help.setPadding(0, dp(16), 0, 0);
                  col.addView(help);

                  home = new ScrollView(this);
                  home.setBackgroundColor(BG);
                  home.addView(col);
              }

              void buildWeb() {
                  webBox = new LinearLayout(this);
                  webBox.setOrientation(LinearLayout.VERTICAL);
                  webBox.setBackgroundColor(BG);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackgroundColor(CARD);
                  bar.setPadding(dp(8), dp(4), dp(8), dp(4));
                  bar.addView(btn("‹ Menu", SLATE, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          showHome();
                      }
                  }, true));
                  bar.addView(btn("Muat ulang", SLATE, new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          if (failed || web.getUrl() == null) web.loadUrl(PANEL);
                          else web.reload();
                      }
                  }, true));

                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String host = u.getHost();
                          if ("127.0.0.1".equals(host) || "localhost".equals(host)) return false;
                          open(u.toString());
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView v, String url, Bitmap icon) {
                          failed = false;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              failed = true;
                              v.loadDataWithBaseURL(PANEL, ERR_HTML, "text/html", "utf-8", null);
                          }
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "Pilih file"), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.setDownloadListener(new DownloadListener() {
                      @Override
                      public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                          download(url, cd);
                      }
                  });
                  webBox.addView(bar, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  webBox.addView(web, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
              }

              void showHome() {
                  webBox.setVisibility(View.GONE);
                  home.setVisibility(View.VISIBLE);
              }

              void showWeb() {
                  home.setVisibility(View.GONE);
                  webBox.setVisibility(View.VISIBLE);
                  if (web.getUrl() == null || failed) web.loadUrl(PANEL);
              }

              // ───────────── aksi
              void installFlow() {
                  if (server == null) {
                      toast("Server lokal gagal jalan. Tutup lalu buka aplikasi ini lagi.");
                      return;
                  }
                  String cmd = server.command();
                  cmdView.setText(cmd);
                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("Perintah pasang", cmd));
                  if (openTermux()) toast("Perintah disalin. Di Termux: tahan layar, pilih Paste, lalu Enter.");
              }

              boolean openTermux() {
                  Intent i = getPackageManager().getLaunchIntentForPackage("com.termux");
                  if (i == null) {
                      toast("Termux belum terpasang. Pakai tombol 1.");
                      return false;
                  }
                  startActivity(i);
                  return true;
              }

              void open(String url) {
                  try {
                      startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                  } catch (Exception e) {
                      toast("Tidak ada aplikasi untuk membuka tautan ini.");
                  }
              }

              void toast(final String s) {
                  runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(MainActivity.this, s, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              boolean installed(String pkg) {
                  try {
                      getPackageManager().getPackageInfo(pkg, 0);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              void checkStatus() {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          final boolean termux = installed("com.termux");
                          boolean ok = false;
                          try {
                              HttpURLConnection c = (HttpURLConnection) new URL(PANEL + "api/session").openConnection();
                              c.setConnectTimeout(700);
                              c.setReadTimeout(700);
                              ok = c.getResponseCode() == 200;
                              c.disconnect();
                          } catch (Exception ignored) {
                          }
                          final boolean panel = ok;
                          ui.post(new Runnable() {
                              @Override
                              public void run() {
                                  status.setText("Termux: " + (termux ? "terpasang" : "belum terpasang")
                                          + "\nPanel server: " + (panel ? "aktif" : "belum aktif"));
                                  status.setTextColor(panel ? GREEN : TX);
                              }
                          });
                      }
                  }).start();
              }

              static String fileName(String cd, String url) {
                  try {
                      if (cd != null) {
                          Matcher m = Pattern.compile("filename\\*=UTF-8''([^;]+)", Pattern.CASE_INSENSITIVE).matcher(cd);
                          if (m.find()) return URLDecoder.decode(m.group(1), "UTF-8").replaceAll("[/\\\\]", "_");
                          m = Pattern.compile("filename=\"?([^\";]+)\"?", Pattern.CASE_INSENSITIVE).matcher(cd);
                          if (m.find()) return m.group(1).replaceAll("[/\\\\]", "_");
                      }
                  } catch (Exception ignored) {
                  }
                  String p = Uri.parse(url).getLastPathSegment();
                  return p == null || p.isEmpty() ? "unduhan.bin" : p;
              }

              void download(final String url, final String cd) {
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                              String ck = CookieManager.getInstance().getCookie(url);
                              if (ck != null) c.setRequestProperty("Cookie", ck);
                              c.setConnectTimeout(5000);
                              c.setReadTimeout(60000);
                              if (c.getResponseCode() != 200) throw new Exception("HTTP " + c.getResponseCode());
                              String name = fileName(cd, url);
                              OutputStream out;
                              String where;
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentValues v = new ContentValues();
                                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                                  v.put(MediaStore.MediaColumns.MIME_TYPE, "application/octet-stream");
                                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ServerMC");
                                  Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                  out = getContentResolver().openOutputStream(u);
                                  where = "Download/ServerMC/" + name;
                              } else {
                                  File d = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                                  out = new FileOutputStream(new File(d, name));
                                  where = d.getPath() + "/" + name;
                              }
                              InputStream in = c.getInputStream();
                              byte[] buf = new byte[65536];
                              int n;
                              try {
                                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                              } finally {
                                  in.close();
                                  out.close();
                              }
                              toast("Tersimpan di " + where);
                          } catch (Exception e) {
                              toast("Gagal mengunduh: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              // ───────────── siklus hidup
              @Override
              protected void onResume() {
                  super.onResume();
                  ui.removeCallbacks(poll);
                  ui.post(poll);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  ui.removeCallbacks(poll);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ_FILE && fileCb != null) {
                      Uri[] r = null;
                      if (res == RESULT_OK && data != null && data.getData() != null) r = new Uri[]{data.getData()};
                      fileCb.onReceiveValue(r);
                      fileCb = null;
                      return;
                  }
                  super.onActivityResult(req, res, data);
              }

              @Override
              public void onBackPressed() {
                  if (webBox.getVisibility() == View.VISIBLE) {
                      if (web.canGoBack() && !failed) web.goBack();
                      else showHome();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          __EOF_MAINACTIVITY_JAVA__

          cat > app/java/id/servermc/panel/LocalServer.java <<'__EOF_LOCALSERVER_JAVA__'
          package id.servermc.panel;

          import android.content.res.AssetManager;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.InetAddress;
          import java.net.ServerSocket;
          import java.net.Socket;
          import java.security.MessageDigest;
          import java.util.HashMap;
          import java.util.Map;

          /**
           * Server kecil di 127.0.0.1 (port acak) yang menyajikan file panel ke Termux.
           * Installer dan semua file diberi hash SHA-256 supaya app lain di HP tidak bisa menyelipkan isi palsu.
           */
          class LocalServer extends Thread {
              static final String[] FILES = {"panel.py", "index.html", "app.js", "app.css"};

              private final ServerSocket ss;
              private final Map<String, byte[]> files = new HashMap<>();
              private final String installerHash;

              LocalServer(AssetManager am) throws Exception {
                  super("asset-server");
                  setDaemon(true);
                  ss = new ServerSocket(0, 8, InetAddress.getByName("127.0.0.1"));
                  String script = new String(read(am, "i.sh"), "UTF-8").replace("@@PORT@@", String.valueOf(ss.getLocalPort()));
                  for (String f : FILES) {
                      byte[] d = read(am, f);
                      files.put(f, d);
                      script = script.replace("@@SHA_" + f.replace('.', '_') + "@@", sha(d));
                  }
                  byte[] inst = script.getBytes("UTF-8");
                  files.put("i.sh", inst);
                  installerHash = sha(inst);
              }

              /** Perintah satu baris yang ditempel di Termux. */
              String command() {
                  return "cd ~ && curl -fsS http://127.0.0.1:" + ss.getLocalPort() + "/i.sh -o mcsetup.sh"
                          + " && echo \"" + installerHash + "  mcsetup.sh\" | sha256sum -c --status && bash mcsetup.sh";
              }

              @Override
              public void run() {
                  while (true) {
                      try {
                          final Socket s = ss.accept();
                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  serve(s);
                              }
                          }).start();
                      } catch (IOException e) {
                          return;
                      }
                  }
              }

              private void serve(Socket s) {
                  try {
                      s.setSoTimeout(5000);
                      BufferedReader r = new BufferedReader(new InputStreamReader(s.getInputStream(), "ISO-8859-1"));
                      String line = r.readLine();
                      String hdr;
                      while ((hdr = r.readLine()) != null && !hdr.isEmpty()) {
                          // header diabaikan
                      }
                      String name = "";
                      if (line != null) {
                          String[] p = line.split(" ");
                          if (p.length > 1) {
                              name = p[1].replaceFirst("^/", "");
                              int q = name.indexOf('?');
                              if (q >= 0) name = name.substring(0, q);
                          }
                      }
                      byte[] body = files.get(name);
                      OutputStream o = s.getOutputStream();
                      if (body == null) {
                          o.write("HTTP/1.0 404 Not Found\r\nContent-Length: 0\r\nConnection: close\r\n\r\n".getBytes("ISO-8859-1"));
                      } else {
                          o.write(("HTTP/1.0 200 OK\r\nContent-Type: application/octet-stream\r\nContent-Length: "
                                  + body.length + "\r\nConnection: close\r\n\r\n").getBytes("ISO-8859-1"));
                          o.write(body);
                      }
                      o.flush();
                  } catch (Exception ignored) {
                      // koneksi putus, abaikan
                  } finally {
                      try {
                          s.close();
                      } catch (IOException ignored) {
                      }
                  }
              }

              private static byte[] read(AssetManager am, String name) throws IOException {
                  InputStream in = am.open(name);
                  try {
                      ByteArrayOutputStream o = new ByteArrayOutputStream();
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) o.write(b, 0, n);
                      return o.toByteArray();
                  } finally {
                      in.close();
                  }
              }

              private static String sha(byte[] d) throws Exception {
                  StringBuilder sb = new StringBuilder();
                  for (byte x : MessageDigest.getInstance("SHA-256").digest(d)) sb.append(String.format("%02x", x));
                  return sb.toString();
              }
          }
          __EOF_LOCALSERVER_JAVA__

          cat > app/assets/i.sh <<'__EOF_I_SH__'
          #!/bin/bash
          # Pemasang Server MC untuk Termux.
          # File ini dibuat oleh aplikasi Server MC. Hash-nya sudah dicek sebelum dijalankan.
          set -eo pipefail

          PORT=@@PORT@@
          say() { printf '\n\033[1;32m==> %s\033[0m\n' "$*"; }
          die() { printf '\n\033[1;31mGAGAL: %s\033[0m\n' "$*" >&2; exit 1; }
          ask() { local a=""; read -r -p "$1" a </dev/tty || true; printf '%s' "$a"; }

          [ -n "${PREFIX:-}" ] && [ -x "$PREFIX/bin/pkg" ] || die "Jalankan perintah ini di aplikasi Termux (versi F-Droid atau GitHub)."
          export MC_HOME="${MC_HOME:-$HOME/minecraft}"
          P="$MC_HOME/panel/panel.py"

          say "1/6  Memperbarui Termux dan memasang paket dasar (bisa beberapa menit)"
          pkg update -y
          pkg upgrade -y -o Dpkg::Options::="--force-confnew"
          pkg install -y python tmux proot resolv-conf curl coreutils

          say "2/6  Mengambil file panel dari aplikasi Server MC"
          mkdir -p "$MC_HOME/panel/static" "$MC_HOME/server" "$MC_HOME/backups" "$MC_HOME/tunnel"
          fetch() { # nama-file tujuan sha256
            curl -fsS "http://127.0.0.1:$PORT/$1" -o "$2.new" \
              || die "Tidak bisa mengambil $1 dari aplikasi Server MC. Buka aplikasinya lagi (jangan ditutup), salin perintah baru, lalu jalankan lagi."
            echo "$3  $2.new" | sha256sum -c --status || { rm -f "$2.new"; die "File $1 rusak atau berubah (hash tidak cocok)."; }
            mv -f "$2.new" "$2"
          }
          fetch panel.py "$P" @@SHA_panel_py@@
          fetch index.html "$MC_HOME/panel/static/index.html" @@SHA_index_html@@
          fetch app.js "$MC_HOME/panel/static/app.js" @@SHA_app_js@@
          fetch app.css "$MC_HOME/panel/static/app.css" @@SHA_app_css@@
          python3 "$P" init

          say "3/6  Pengaturan awal"
          if python3 "$P" config | grep -q '"contact": ""'; then
            C="${MC_CONTACT:-}"
            [ -n "$C" ] || C="$(ask 'Email atau URL kontakmu (wajib oleh PaperMC, hanya dikirim ke PaperMC): ')"
            [ -n "$C" ] || die "Kontak tidak boleh kosong."
            python3 "$P" config set contact "$C"
          fi
          EULA=no
          if [ -f "$MC_HOME/server/eula.txt" ] && grep -qi '^eula=true' "$MC_HOME/server/eula.txt"; then
            EULA=yes
          else
            echo "Server Minecraft butuh persetujuan EULA: https://aka.ms/MinecraftEULA"
            A="${MC_ACCEPT_EULA:-}"
            [ -n "$A" ] || A="$(ask 'Kamu setuju dengan EULA itu? (y/N) ')"
            case "$A" in [YyJj]*) python3 "$P" eula; EULA=yes ;; esac
          fi

          say "4/6  Mengunduh Paper (server Java)"
          OUT="$(python3 "$P" install-paper)" || die "Gagal mengunduh Paper. Cek internet, lalu jalankan perintah ini lagi."
          echo "$OUT"
          JM="$(echo "$OUT" | sed -n 's/^JAVA_MAJOR=//p')"
          [ -n "$JM" ] || JM=21

          say "5/6  Memasang Java $JM"
          pkg install -y "openjdk-$JM" || die "Paket openjdk-$JM tidak ketemu. Coba: pkg search openjdk"

          say "6/6  Memasang Geyser dan Floodgate (agar pemain Bedrock bisa join)"
          python3 "$P" install-geyser || echo "Geyser gagal diunduh. Bisa dicoba lagi dari panel, tab Bedrock."

          PW="$(python3 "$P" passwd --init)"

          mkdir -p "$PREFIX/bin"
          cat > "$PREFIX/bin/mc" <<'MCEOF'
          #!/bin/bash
          export MC_HOME="${MC_HOME:-$HOME/minecraft}"
          PY="$MC_HOME/panel/panel.py"
          S=mc-panel
          panel_alive() { [ "$(tmux list-panes -t "=$S:" -F '#{pane_dead}' 2>/dev/null | head -n1)" = "0" ]; }
          panel_port() { python3 "$PY" config | sed -n 's/.*"port": \([0-9]*\).*/\1/p'; }
          panel_start() {
            if panel_alive; then echo "Panel sudah jalan di http://localhost:$(panel_port)"; return 0; fi
            tmux kill-session -t "=$S" 2>/dev/null || true
            tmux new-session -d -s "$S" -c "$MC_HOME" "exec python3 '$PY' serve" \; set-window-option -t "=$S:" remain-on-exit on
            sleep 2
            if panel_alive; then
              echo "Panel jalan di http://localhost:$(panel_port)"
            else
              tmux capture-pane -p -t "=$S:" 2>/dev/null | tail -n 8
              tmux kill-session -t "=$S" 2>/dev/null || true
              echo "Panel gagal jalan."
              return 1
            fi
          }
          case "${1:-help}" in
            start) panel_start; python3 "$PY" server start ;;
            stop|restart|kill|status) python3 "$PY" server "$1" ;;
            console) echo "Untuk keluar dari konsol tanpa mematikan server: tekan Ctrl+B lalu D"; sleep 1; exec tmux attach -t "=mc-server" ;;
            panel)
              case "${2:-start}" in
                start) panel_start ;;
                stop) tmux kill-session -t "=$S" 2>/dev/null && echo "Panel dihentikan" || echo "Panel tidak jalan" ;;
                restart) tmux kill-session -t "=$S" 2>/dev/null || true; sleep 1; panel_start ;;
                *) echo "Pakai: mc panel [start|stop|restart]" ;;
              esac ;;
            passwd) shift; python3 "$PY" passwd "$@" ;;
            update) shift; python3 "$PY" install-paper "$@" ;;
            geyser) python3 "$PY" install-geyser ;;
            backup) python3 "$PY" backup ;;
            tunnel) shift; python3 "$PY" tunnel "${1:-show}" ;;
            config) shift; python3 "$PY" config "$@" ;;
            lan) python3 "$PY" config set bind 0.0.0.0; "$0" panel restart; echo "Panel bisa dibuka dari Wi-Fi: http://IP-HP:$(panel_port) (pakai password)" ;;
            local) python3 "$PY" config set bind 127.0.0.1; "$0" panel restart ;;
            *)
              cat <<'HELP'
          Server MC, perintah:
            mc start            nyalakan panel dan server
            mc stop             matikan server dengan aman
            mc restart          mulai ulang server
            mc status           lihat status server
            mc console          buka konsol server (keluar: Ctrl+B lalu D)
            mc kill             paksa matikan server
            mc panel [start|stop|restart]   kelola panel web
            mc backup           buat backup sekarang
            mc update [versi]   perbarui atau ganti versi Paper
            mc geyser           perbarui Geyser dan Floodgate
            mc tunnel [start|stop|show|install]   tunnel playit.gg
            mc passwd [baru]    ganti password panel
            mc lan | mc local   buka panel ke Wi-Fi | hanya di HP ini
            mc config           lihat pengaturan
          HELP
              ;;
          esac
          MCEOF
          chmod +x "$PREFIX/bin/mc"

          # panel menyala otomatis setiap Termux dibuka
          touch "$HOME/.bashrc"
          if ! grep -q 'server-mc autostart' "$HOME/.bashrc"; then
            cat >> "$HOME/.bashrc" <<'RCEOF'
          # server-mc autostart: nyalakan panel saat Termux dibuka
          command -v mc >/dev/null 2>&1 && mc panel start >/dev/null 2>&1 || true
          RCEOF
          fi

          if command -v termux-wake-lock >/dev/null 2>&1; then termux-wake-lock || true; fi
          PANEL_OK=no
          if mc panel start; then PANEL_OK=yes; fi
          SERVER_OK=no
          if [ "$EULA" = yes ] && mc start; then SERVER_OK=yes; fi

          PANEL_PORT="$(python3 "$P" config | sed -n 's/.*"port": \([0-9]*\).*/\1/p')"
          echo
          echo "================================================================"
          echo " Selesai. Server MC terpasang di $MC_HOME"
          echo "================================================================"
          if [ "$PANEL_OK" = yes ]; then
            echo " Panel     : http://localhost:$PANEL_PORT (buka lewat aplikasi Server MC, tombol 3)"
          else
            echo " Panel     : BELUM JALAN. Tutup Termux, buka lagi, lalu ketik: mc panel start"
          fi
          if [ -n "$PW" ]; then echo " Password  : $PW   (ganti nanti dengan: mc passwd)"; fi
          if [ "$SERVER_OK" = yes ]; then
            echo " Server    : sedang dinyalakan. Start pertama butuh beberapa menit (membuat dunia)."
          elif [ "$EULA" = yes ]; then
            echo " Server    : GAGAL dinyalakan. Coba ketik: mc start"
          else
            echo " Server    : belum jalan karena EULA belum disetujui. Setujui di panel, menu Pengaturan."
          fi
          echo " Bedrock   : alamat IP HP, port 19132 (UDP), lewat Geyser."
          echo " Penting   : matikan penghemat baterai untuk Termux agar server tidak dimatikan Android."
          echo " Bantuan   : ketik: mc help"
          __EOF_I_SH__

          cat > app/assets/panel.py <<'__EOF_PANEL_PY__'
          #!/usr/bin/env python3
          """Panel server Minecraft untuk Termux (Paper + Geyser/Floodgate). Hanya pakai library bawaan Python."""
          import os, sys, re, json, time, shlex, shutil, socket, hashlib, hmac, secrets, tarfile, zipfile, platform
          import threading, subprocess, traceback, urllib.request, urllib.parse, urllib.error
          from collections import deque
          from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
          from pathlib import Path

          VERSION = "1.0"
          HOME = Path(os.environ.get("MC_HOME") or (Path.home() / "minecraft")).resolve()
          SERVER, PANEL, BACKUPS, TUNNEL = HOME / "server", HOME / "panel", HOME / "backups", HOME / "tunnel"
          STATIC, CFG_FILE, STATE_FILE = PANEL / "static", PANEL / "config.json", PANEL / "state.json"
          S_SRV, S_TUN = "mc-server", "mc-tunnel"
          PAPER_API = os.environ.get("MC_PAPER_API", "https://fill.papermc.io/v3/projects/paper")
          MR_API = os.environ.get("MC_MODRINTH_API", "https://api.modrinth.com/v2")
          GEYSER_API = os.environ.get("MC_GEYSER_API", "https://download.geysermc.org/v2/projects")
          PLAYIT_URL = os.environ.get("MC_PLAYIT_URL", "https://github.com/playit-cloud/playit-agent/releases/latest/download")
          GENERIC_UA = "termux-mc-panel/" + VERSION


          class ApiError(Exception):
              def __init__(self, code, msg):
                  super().__init__(msg)
                  self.code, self.msg = code, msg


          # ───────────────────────── konfigurasi ─────────────────────────
          DEFAULTS = {"port": 8080, "bind": "127.0.0.1", "ram_mb": 0, "jvm_flags": "-XX:+DisableExplicitGC -Dfile.encoding=UTF-8",
                      "java": "", "contact": "", "auto_restart": True, "backup_every_h": 0, "backup_keep": 5,
                      "upload_max_mb": 512, "pw_hash": "", "pw_salt": ""}
          SETTABLE = {"ram_mb": int, "jvm_flags": str, "contact": str, "auto_restart": bool, "backup_every_h": int,
                      "backup_keep": int, "bind": str, "java": str, "port": int, "upload_max_mb": int}


          def read_text(p, default=""):
              try:
                  return Path(p).read_text("utf-8", "replace")
              except Exception:
                  return default


          def to_int(x, d):
              try:
                  return int(str(x).strip())
              except Exception:
                  return d


          def meminfo():
              d = {}
              try:
                  for l in open("/proc/meminfo"):
                      k, v = l.split(":", 1)
                      d[k] = int(v.split()[0]) // 1024
              except Exception:
                  pass
              return d


          def load_cfg():
              try:
                  d = json.loads(CFG_FILE.read_text())
              except Exception:
                  d = {}
              c = {**DEFAULTS, **d}
              if not c["ram_mb"]:
                  tot = meminfo().get("MemTotal", 4096)
                  c["ram_mb"] = max(768, min(int(tot * 0.45) // 256 * 256, 4096))
              return c


          def save_cfg(c):
              PANEL.mkdir(parents=True, exist_ok=True)
              tmp = CFG_FILE.with_suffix(".tmp")
              tmp.write_text(json.dumps(c, indent=2))
              os.chmod(tmp, 0o600)
              os.replace(tmp, CFG_FILE)


          def apply_settings(d):
              c = load_cfg()
              for k, v in d.items():
                  if k not in SETTABLE:
                      continue
                  t = SETTABLE[k]
                  if t is bool:
                      v = v if isinstance(v, bool) else str(v).lower() in ("1", "true", "yes", "on")
                  elif t is int:
                      v = to_int(v, None)
                      if v is None:
                          raise ApiError(400, f"'{k}' harus berupa angka")
                  else:
                      v = str(v).strip()
                  if k == "ram_mb" and not 256 <= v <= 65536:
                      raise ApiError(400, "RAM harus antara 256 dan 65536 MB")
                  if k == "bind" and v not in ("127.0.0.1", "0.0.0.0"):
                      raise ApiError(400, "bind harus 127.0.0.1 atau 0.0.0.0")
                  if k == "port" and not 1024 <= v <= 65535:
                      raise ApiError(400, "Port panel harus 1024-65535")
                  if k in ("backup_every_h", "backup_keep", "upload_max_mb") and v < 0:
                      raise ApiError(400, f"'{k}' tidak boleh negatif")
                  if k == "jvm_flags":
                      try:
                          shlex.split(v)
                      except ValueError:
                          raise ApiError(400, "JVM flags tidak valid (tanda kutip tidak berpasangan)")
                  c[k] = v
              save_cfg(c)
              return c


          def hash_pw(pw, salt):
              return hashlib.pbkdf2_hmac("sha256", pw.encode(), bytes.fromhex(salt), 200_000).hex()


          def set_password(pw):
              c = load_cfg()
              c["pw_salt"] = secrets.token_hex(16)
              c["pw_hash"] = hash_pw(pw, c["pw_salt"])
              save_cfg(c)


          def check_password(pw):
              c = load_cfg()
              return bool(c["pw_hash"]) and hmac.compare_digest(hash_pw(pw, c["pw_salt"]), c["pw_hash"])


          def get_desired():
              try:
                  return bool(json.loads(STATE_FILE.read_text()).get("desired"))
              except Exception:
                  return False


          def set_desired(v):
              PANEL.mkdir(parents=True, exist_ok=True)
              STATE_FILE.write_text(json.dumps({"desired": bool(v)}))


          # ───────────────────────── unduhan ─────────────────────────
          def http_open(url, ua, timeout=30):
              return urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "application/json, */*"}), timeout=timeout)


          def get_json(url, ua):
              with http_open(url, ua) as r:
                  return json.load(r)


          def download(url, dest, ua, sha256=None, sha512=None):
              dest = Path(dest)
              dest.parent.mkdir(parents=True, exist_ok=True)
              tmp = dest.with_name(dest.name + ".part")
              a, b = hashlib.sha256(), hashlib.sha512()
              try:
                  with http_open(url, ua, 90) as r, open(tmp, "wb") as f:
                      while True:
                          ch = r.read(1 << 16)
                          if not ch:
                              break
                          f.write(ch)
                          a.update(ch)
                          b.update(ch)
                  if sha256 and a.hexdigest().lower() != sha256.lower():
                      raise ApiError(502, "Checksum SHA-256 tidak cocok, unduhan dibatalkan")
                  if sha512 and b.hexdigest().lower() != sha512.lower():
                      raise ApiError(502, "Checksum SHA-512 tidak cocok, unduhan dibatalkan")
                  if tmp.stat().st_size < 100:
                      raise ApiError(502, "Hasil unduhan terlalu kecil, kemungkinan salah")
                  os.replace(tmp, dest)
              finally:
                  tmp.unlink(missing_ok=True)


          # ───────────────────────── Paper & Java ─────────────────────────
          def vkey(v):
              return tuple(int(x) for x in v.split("."))


          def is_rel(v):
              return bool(re.fullmatch(r"\d+(\.\d+)+", v))


          def paper_ua():
              c = load_cfg()["contact"].strip()
              if not c:
                  raise ApiError(400, "Isi 'Kontak' (email atau URL) di Pengaturan dulu. PaperMC mewajibkannya untuk unduhan.")
              return f"{GENERIC_UA} ({c})"


          def paper_versions():
              d = get_json(PAPER_API, paper_ua())
              vs = {v for grp in d["versions"].values() for v in grp if is_rel(v)}
              return sorted(vs, key=vkey, reverse=True)


          def paper_build(ver):
              for b in get_json(f"{PAPER_API}/versions/{ver}/builds", paper_ua()):
                  if b.get("channel") in ("STABLE", "RECOMMENDED"):
                      return b["id"], b["downloads"]["server:default"]
              return None


          def java_major(v):
              if not is_rel(v):
                  return 21
              t = vkey(v)
              return 25 if t[0] >= 26 else 21 if t >= (1, 20, 5) else 17


          def install_paper(ver=None):
              ua, found = paper_ua(), None
              if ver:
                  if not is_rel(ver):
                      raise ApiError(400, "Versi tidak valid")
                  found = paper_build(ver)
                  if not found:
                      raise ApiError(404, f"Paper {ver} belum punya build stabil")
              else:
                  for v in paper_versions():
                      found = paper_build(v)
                      if found:
                          ver = v
                          break
                  if not found:
                      raise ApiError(502, "Tidak ada build Paper stabil yang ketemu")
              bid, dl = found
              SERVER.mkdir(parents=True, exist_ok=True)
              dest = SERVER / "paper.jar"
              if dest.exists():
                  shutil.copy2(dest, SERVER / "paper.jar.bak")
              download(dl["url"], dest, ua, sha256=(dl.get("checksums") or {}).get("sha256"))
              (SERVER / ".mcversion").write_text(ver)
              (SERVER / ".paperbuild").write_text(str(bid))
              return {"version": ver, "build": bid, "java": java_major(ver)}


          def java_bin(major=None):
              c = load_cfg()
              if c["java"]:
                  return c["java"]
              pre = os.environ.get("PREFIX", "")
              if major and pre:
                  p = Path(pre) / f"lib/jvm/java-{major}-openjdk/bin/java"
                  if p.exists():
                      return str(p)
              return shutil.which("java") or "java"


          def eula_ok():
              return bool(re.search(r"(?mi)^\s*eula\s*=\s*true", read_text(SERVER / "eula.txt")))


          # ───────────────────────── tmux & status server ─────────────────────────
          def tmux(*a):
              try:
                  return subprocess.run(["tmux", *a], capture_output=True, text=True, timeout=20)
              except FileNotFoundError:
                  raise ApiError(500, "tmux belum terpasang. Jalankan: pkg install tmux")


          def pane_info(sess):
              r = tmux("list-panes", "-t", f"={sess}:", "-F", "#{pane_pid}|#{pane_dead}|#{session_created}|#{pane_dead_status}")
              if r.returncode or not r.stdout.strip():
                  return None
              a = r.stdout.strip().splitlines()[0].split("|")
              return {"pid": int(a[0]), "dead": a[1] == "1", "since": int(a[2]), "code": a[3] if len(a) > 3 else ""}


          RE_JOIN = re.compile(r"\]: ([A-Za-z0-9_.\-]{1,40}) joined the game")
          RE_LEFT = re.compile(r"\]: ([A-Za-z0-9_.\-]{1,40}) left the game")
          RE_DONE = re.compile(r"\]: Done \([\d.,]+s\)!")
          RE_STOP = re.compile(r"\]: Stopping (?:the )?server")


          class LogTailer(threading.Thread):
              """Membaca logs/latest.log terus-menerus: konsol, daftar pemain, status 'sudah siap'."""
              def __init__(self):
                  super().__init__(daemon=True)
                  self.lock = threading.Lock()
                  self.buf, self.next_id = deque(maxlen=3000), 1
                  self.online, self.done, self.stopping = set(), False, False
                  self.ino, self.off, self.partial, self.first = None, 0, b"", True

              def note(self, text):
                  self._add(text)

              def _add(self, line):
                  with self.lock:
                      self.buf.append((self.next_id, line))
                      self.next_id += 1

              def feed(self, line):
                  self._add(line)
                  with self.lock:
                      m = RE_JOIN.search(line)
                      if m:
                          self.online.add(m.group(1))
                      m = RE_LEFT.search(line)
                      if m:
                          self.online.discard(m.group(1))
                      if RE_DONE.search(line):
                          self.done = True
                      if RE_STOP.search(line):
                          self.stopping = True

              def flags(self):
                  with self.lock:
                      return {"done": self.done, "stopping": self.stopping}

              def players(self):
                  with self.lock:
                      return sorted(self.online)

              def since(self, n):
                  with self.lock:
                      items = [(i, l) for i, l in self.buf if i > n] if n else list(self.buf)[-300:]
                      return items, self.next_id - 1

              def last_id(self):
                  with self.lock:
                      return self.next_id - 1

              def wait_for(self, text, after, timeout):
                  end = time.time() + timeout
                  while time.time() < end:
                      with self.lock:
                          if any(i > after and text in l for i, l in self.buf):
                              return True
                      time.sleep(0.3)
                  return False

              def poll_once(self):
                  """Satu putaran baca log. Mengembalikan True kalau masih ada data yang belum terbaca."""
                  path = SERVER / "logs" / "latest.log"
                  more = False
                  try:
                      st = os.stat(path)
                      if self.ino != st.st_ino or st.st_size < self.off:
                          self.ino, self.off, self.partial = st.st_ino, 0, b""
                          with self.lock:
                              self.online, self.done, self.stopping = set(), False, False
                          if not self.first:
                              self._add("─── log baru (server dimulai ulang) ───")
                          if st.st_size > 2_000_000:  # log besar: lompat ke ekor, anggap server sudah siap
                              self.off = st.st_size - 400_000
                              self.partial = b"\x00"
                              self.done = True
                          self.first = False
                      if st.st_size > self.off:
                          with open(path, "rb") as f:
                              f.seek(self.off)
                              data = f.read(1 << 20)
                          self.off += len(data)
                          parts = (self.partial + data).split(b"\n")
                          self.partial = parts.pop()
                          for raw in parts:
                              if raw.startswith(b"\x00"):
                                  continue
                              self.feed(raw.decode("utf-8", "replace").rstrip("\r"))
                          more = st.st_size > self.off
                  except FileNotFoundError:
                      pass
                  except Exception:
                      traceback.print_exc()
                  return more

              def run(self):
                  while True:
                      if not self.poll_once():
                          time.sleep(0.7)


          TAILER = LogTailer()


          def server_state():
              pi = pane_info(S_SRV)
              if not pi or pi["dead"]:
                  return {"state": "stopped", "pid": None, "crashed": bool(pi), "code": pi["code"] if pi else ""}
              f = TAILER.flags()
              st = "stopping" if f["stopping"] else "running" if f["done"] else "starting"
              return {"state": st, "pid": pi["pid"], "since": pi["since"]}


          def server_cmd():
              c = load_cfg()
              ver = read_text(SERVER / ".mcversion").strip()
              ram = int(c["ram_mb"])
              return [java_bin(java_major(ver) if ver else None), f"-Xms{min(512, ram)}M", f"-Xmx{ram}M",
                      *shlex.split(c["jvm_flags"]), "-jar", "paper.jar", "--nogui"]


          def start_server():
              if server_state()["state"] != "stopped":
                  raise ApiError(409, "Server sudah jalan")
              if not (SERVER / "paper.jar").exists():
                  raise ApiError(400, "paper.jar belum ada. Pasang Paper dulu (menu Pengaturan).")
              if not eula_ok():
                  raise ApiError(400, "Minecraft EULA belum disetujui (menu Pengaturan).")
              tmux("kill-session", "-t", f"={S_SRV}")
              cmd = "exec " + " ".join(shlex.quote(x) for x in server_cmd())
              r = tmux("new-session", "-d", "-s", S_SRV, "-x", "200", "-y", "50", "-c", str(SERVER), cmd,
                       ";", "set-window-option", "-t", f"={S_SRV}:", "remain-on-exit", "on")
              if r.returncode:
                  raise ApiError(500, "Gagal menjalankan tmux: " + r.stderr.strip())
              set_desired(True)
              TAILER.note("[panel] Server dijalankan…")


          def send_cmd(text):
              text = (text or "").strip().lstrip("/")
              if not text or len(text) > 500 or re.search(r"[\x00-\x1f\x7f]", text):
                  raise ApiError(400, "Perintah tidak valid")
              if server_state()["state"] == "stopped":
                  raise ApiError(409, "Server sedang mati")
              t = f"={S_SRV}:"
              tmux("send-keys", "-t", t, "-l", "--", text)
              tmux("send-keys", "-t", t, "Enter")


          def kill_server():
              set_desired(False)
              tmux("kill-session", "-t", f"={S_SRV}")


          def stop_server():
              set_desired(False)
              if server_state()["state"] == "stopped":
                  return
              try:
                  send_cmd("stop")
              except ApiError:
                  pass

              def killer():
                  for _ in range(180):
                      if server_state()["state"] == "stopped":
                          return
                      time.sleep(0.5)
                  kill_server()
              threading.Thread(target=killer, daemon=True).start()


          def restart_server():
              def run():
                  try:
                      stop_server()
                      for _ in range(240):
                          if server_state()["state"] == "stopped":
                              break
                          time.sleep(0.5)
                      time.sleep(1)
                      start_server()
                  except Exception as e:
                      TAILER.note(f"[panel] Gagal restart: {e}")
              threading.Thread(target=run, daemon=True).start()


          _prev = {}


          def proc_stats(pid):
              try:
                  rss = 0
                  for l in open(f"/proc/{pid}/status"):
                      if l.startswith("VmRSS:"):
                          rss = int(l.split()[1]) // 1024
                  st = open(f"/proc/{pid}/stat").read().rsplit(")", 1)[1].split()
                  ticks, t, cpu = int(st[11]) + int(st[12]), time.time(), None
                  p = _prev.get(pid)
                  if p and t > p[0]:
                      cpu = max(0, round((ticks - p[1]) / os.sysconf("SC_CLK_TCK") / (t - p[0]) * 100))
                  _prev[pid] = (t, ticks)
                  return {"rss_mb": rss, "cpu": cpu}
              except Exception:
                  return {"rss_mb": None, "cpu": None}


          def lan_ip():
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              try:
                  s.connect(("10.255.255.255", 1))
                  return s.getsockname()[0]
              except Exception:
                  return None
              finally:
                  s.close()


          # ───────────────────────── properti ─────────────────────────
          def read_props():
              d = {}
              for l in read_text(SERVER / "server.properties").splitlines():
                  l = l.strip()
                  if l and not l.startswith("#") and "=" in l:
                      k, v = l.split("=", 1)
                      d[k.strip()] = v.strip()
              return d


          def write_props(ch):
              for k, v in ch.items():
                  if not re.fullmatch(r"[a-z0-9.\-]{1,60}", k) or re.search(r"[\r\n]", str(v)):
                      raise ApiError(400, f"Properti tidak valid: {k}")
              p = SERVER / "server.properties"
              left, out = {k: v for k, v in ch.items()}, []
              for l in read_text(p).splitlines():
                  k = l.split("=", 1)[0].strip() if "=" in l and not l.lstrip().startswith("#") else None
                  if k in left:
                      out.append(f"{k}={left.pop(k)}")
                  else:
                      out.append(l)
              out += [f"{k}={v}" for k, v in left.items()]
              SERVER.mkdir(parents=True, exist_ok=True)
              tmp = p.with_suffix(".tmp")
              tmp.write_text("\n".join(out) + "\n")
              os.replace(tmp, p)


